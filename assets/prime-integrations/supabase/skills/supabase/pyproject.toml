[project]
name = "gooeypi-prime-supabase"
version = "0.1.0"
description = "Prime Agent integration for Supabase's official hosted MCP server."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supabase"]
