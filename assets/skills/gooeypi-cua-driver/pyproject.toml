[project]
name = "gooeypi-cua-driver"
version = "0.1.0"
description = "Prime Agent bridge to a separately installed Cua Driver runtime."
requires-python = ">=3.10"
dependencies = ["mcp>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gooeypi_cua_driver"]
