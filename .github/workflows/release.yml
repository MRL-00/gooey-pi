name: Public macOS release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    env:
      RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Fail closed unless every release credential is configured
        run: npm run release:preflight
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: prime-work-public-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
