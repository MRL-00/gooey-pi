name: Public cross-platform release packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      # Ship both mac architectures as separate DMG/ZIP builds. Each leg runs
      # on a runner whose native architecture matches the target so
      # install-app-deps never cross-compiles node-pty or zeromq, and one
      # leg's failure never cancels the other's signed build.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Fail closed unless every release credential is configured
        run: npm run release:preflight
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # CI runs the full typecheck/lint/test suite for this commit; the release
      # job only builds the bundle, packages, and runs post-package verification.
      - name: Build, sign, notarize, and verify release packages
        run: npm run package:mac -- --skip-verify --arch ${{ matrix.arch }}
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gooeypi-public-macos-${{ matrix.arch }}
          path: |
            release/mac/${{ matrix.arch }}/*.dmg
            release/mac/${{ matrix.arch }}/*.zip
            release/mac/${{ matrix.arch }}/latest*.yml
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run package:linux -- --skip-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gooeypi-public-linux
          path: |
            release/linux/**/*.AppImage
            release/linux/**/*.deb
            release/linux/**/*.rpm
            release/linux/**/latest*.yml
          if-no-files-found: error

  package-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run package:win -- --skip-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gooeypi-public-windows
          path: |
            release/win/**/*.exe
            release/win/**/*.zip
            release/win/**/latest*.yml
          if-no-files-found: error

  release-packages:
    # Aggregate gate: one required status that fails when any packaging job
    # fails or is cancelled.
    needs: [package, package-linux, package-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every packaging job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Packaging job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo 'A packaging job did not succeed.'
              exit 1
            fi
          done
